name: Deploy Backend to EC2

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Spring Boot App
        run: ./gradlew clean bootJar

      - name: Move jar to ./app.jar
        run: |
          rm -f app.jar
          cp build/libs/*.jar app.jar

      - name: List JAR to verify
        run: ls -al app.jar

      - name: Copy app.jar and Dockerfile to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.REMOTE_IP }}
          username: ${{ secrets.REMOTE_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "app.jar,Dockerfile"
          target: "/home/${{ secrets.REMOTE_USERNAME }}/Docker/backend"

      - name: Restart Docker (build backend image)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.REMOTE_IP }}
          username: ${{ secrets.REMOTE_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cd /home/${{ secrets.REMOTE_USERNAME }}/Docker
            docker-compose stop springboot
            docker-compose rm -f springboot
            docker-compose build --no-cache springboot
            docker-compose up -d springboot
            docker image prune -f
