spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/skhuthon?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none

    show-sql: false
    properties:
      hibernate:
        format_sql: false
        highlight_sql: false

ai:
  service:
    base-url: ${AI_SERVICE_BASE_URL}

logging:
  level:
    org.hibernate.SQL: warn
    org.hibernate.orm.jdbc.bind: warn
    com.skhuthon_backend: debug